# Pinned external tools. `juggernaught tools install` downloads exactly these
# artifacts and refuses anything whose SHA-256 differs from the pin.
# Managed by the release pipeline / updater; verified 2026-11-22.

[tool.photocraft]
repo = "storytold/photocraft"
version = "v0.23.1"
install = "github-tarball"
bin = "bin/photocraft-cli"
mcp = ["mcp"]
license = "MIT OR Apache-2.0"
timeout_secs = 600
memory_mb = 4096
[tool.photocraft.dist]
asset = "photocraft-{v}-linux-{arch}.tar.gz"
sha256_aarch64 = "fcc81c38ae62c72fa9f4fd1ec3d18396493ba261662792d6995cc35905ce71d2"
sha256_x86_64 = "4383aef67a07cc370ad250a6ed60015205d3e6c463faf3ff4b0f67b8178ccfc8"

