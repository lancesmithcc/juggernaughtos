# Pinned external tools. `juggernaught tools install` downloads exactly these
# artifacts and refuses anything whose SHA-256 differs from the pin.
# Managed by the release pipeline / updater; verified 2026-11-22 (macOS assets 2026-11-23,
# checked against each release's SHA256SUMS.txt / .sha256 files).

[tool.photocraft]
repo = "storytold/photocraft"
version = "v0.23.1"
install = "github-tarball"
bin = "bin/photocraft-cli"
bin_macos = "photocraft-cli"
mcp = ["mcp"]
license = "MIT OR Apache-2.0"
timeout_secs = 600
memory_mb = 4096
[tool.photocraft.dist]
asset = "photocraft-{v}-linux-{arch}.tar.gz"
sha256_aarch64 = "fcc81c38ae62c72fa9f4fd1ec3d18396493ba261662792d6995cc35905ce71d2"
sha256_x86_64 = "4383aef67a07cc370ad250a6ed60015205d3e6c463faf3ff4b0f67b8178ccfc8"
asset_macos = "photocraft-cli-{v}-macos-universal.zip"
sha256_macos_aarch64 = "a6ecdc6d4add02881642bda0a0b191b4974118651f2ec5641dc71b2c3ff4b752"
sha256_macos_x86_64 = "a6ecdc6d4add02881642bda0a0b191b4974118651f2ec5641dc71b2c3ff4b752"

