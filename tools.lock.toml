memory_mb = 2048
note = "Voice (text to speech) isn't available yet: Kokoros publishes no ready-made build, so it will ship with a later Juggernaught release."

[tool.google-fonts]
repo = "google/fonts"
version = "main@2026-11-21"
install = "on-demand"
bin = ""
license = "OFL-1.1 / Apache-2.0 / UFL (per family)"
network = true
note = "Ready: each font family your brand uses is fetched once, with its licence, when a page or document needs it."
