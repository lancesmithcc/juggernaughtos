[package]
name = "jugg-auth"
description = "Passwordless auth: magic links, passkeys (WebAuthn), TOTP, recovery codes, sessions"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["passkeys"]
passkeys = ["dep:webauthn-rs", "dep:url"]

[dependencies]
jugg-core.workspace = true
jugg-crypto.workspace = true
jugg-db.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
argon2.workspace = true
totp-rs.workspace = true
webauthn-rs = { version = "0.5", optional = true, features = ["danger-allow-state-serialisation"] }
url = { version = "2", optional = true }

[dev-dependencies]
tokio.workspace = true
